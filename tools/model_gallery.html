<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWG3 model gallery</title>
<style>
  :root { --bg: #2a241c; --ink: #efe4cc; --dim: #b9a98a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, serif; overflow: hidden; }
  #ui { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px; background: rgba(30, 24, 16, .85); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; z-index: 2; }
  #ui b { font-size: 16px; } #ui span { color: var(--dim); }
  button { background: #5a4630; color: var(--ink); border: 1px solid #8a6c48; border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .lab { position: fixed; transform: translate(-50%, 0); color: var(--ink); font-size: 12px; text-align: center; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: nowrap; }
  .lab i { color: var(--dim); font-style: normal; font-size: 11px; }
</style>
</head>
<body>
<div id="ui"><b>CWG3 model gallery</b><span>every model in assets/art/models.js, at real size (metres). Drag to orbit, wheel to zoom.</span>
  <button id="spin">pause spin</button></div>
<canvas id="cv"></canvas>
<script src="../src/vendor/three.min.js"></script>
<script>window.CW = {};</script>
<script src="../assets/art/models.js"></script>
<script src="../src/world_edges.js"></script>
<script>
'use strict';
// Drawn with the game's own instanced shader (src/world_edges.js), so patterns and lighting match the battlefield exactly.
const dec = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const cv = document.getElementById('cv'), ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2)); ren.setClearColor(0x6f7a5a);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, .5, 2000);
const items = [];
// preview size for models normalised to height 1 / length 1 (from the manifest's preview_m)
const PREV = { broadleaf: 14, pine: 18, bush: 2, fence: 3.5, stoneA: 1.2, stoneB: 0.8, logsBig: 1.4, stump: .6, rockA: 2.5, rockC: 2.5, stepRocks: 6 };
const keys = Object.keys(CW.MODELS).sort((a, b) => (CW.MODELS[a].norm === 'meters') - (CW.MODELS[b].norm === 'meters') || a.localeCompare(b)).reverse();
let x = 0, row = 0, rowW = 0; const GAP = 4, MAXW = 80, rows = [[]];
keys.forEach(k => { const m = CW.MODELS[k], s = m.norm === 'meters' ? 1 : (PREV[k] || 3) / (m.norm === 'height' ? 1 : 1), w = m.w * s;
  if (rowW + w > MAXW && rows[row].length) { row++; rows[row] = []; rowW = 0; } rows[row].push({ k, s, w }); rowW += w + GAP; });
scene.fog = new THREE.Fog(0x6f7a5a, 1e5, 2e5); const list = []; list.W3 = (x, y) => ({ x, y: 0, z: y });
rows.forEach((r, ri) => { const tot = r.reduce((a, it) => a + it.w + GAP, -GAP); let cx = -tot / 2;
  r.forEach(it => { const m = CW.MODELS[it.k], pos = new THREE.Vector3(cx + it.w / 2, 0, -ri * 32);
    list.push({ kind: it.k, x: pos.x, y: pos.z, lift: 0, yaw: 0, pitch: 0, rnd: .5, sx: it.s, sy: it.s, sz: it.s });
    const disc = new THREE.Mesh(new THREE.CircleGeometry(it.w * .62, 32), new THREE.MeshBasicMaterial({ color: 0x5d6848 })); disc.rotation.x = -Math.PI / 2; disc.position.copy(pos); disc.position.y = -.02; scene.add(disc);
    const lab = document.createElement('div'); lab.className = 'lab'; lab.innerHTML = `${it.k}<br><i>${m.tris} tris · ${m.norm === 'meters' ? m.h.toFixed(1) + ' m tall' : 'kit, shown ~' + (PREV[it.k] || 3) + ' m'}</i>`; document.body.appendChild(lab);
    items.push({ pos, lab }); cx += it.w + GAP; }); });
CW.WorldEdges.instanced(scene, list, CW.MODELS, keys, { uFog: { value: scene.fog.color }, uFogR: { value: new THREE.Vector2(1e5, 2e5) } });
const st = window.st = { yaw: .3, pitch: .55, dist: 175, spin: true, t: 0 };
addEventListener('pointerdown', e => { const x0 = e.clientX, y0 = e.clientY, a = st.yaw, b = st.pitch;
  const mv = ev => { st.yaw = a - (ev.clientX - x0) * .006; st.pitch = Math.max(.08, Math.min(1.4, b + (ev.clientY - y0) * .004)); };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); }; addEventListener('pointermove', mv); addEventListener('pointerup', up); });
addEventListener('wheel', e => { st.dist = Math.max(15, Math.min(400, st.dist * (e.deltaY > 0 ? 1.1 : .9))); }, { passive: true });
document.getElementById('spin').onclick = e => { st.spin = !st.spin; e.target.textContent = st.spin ? 'pause spin' : 'spin'; };
function frame() {
  const w = innerWidth, h = innerHeight; if (cv.width !== Math.floor(w * ren.getPixelRatio())) { ren.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  if (st.spin) st.yaw += .002;
  const cz = -(rows.length - 1) * 16; cam.position.set(Math.sin(st.yaw) * Math.cos(st.pitch) * st.dist, Math.sin(st.pitch) * st.dist, cz + Math.cos(st.yaw) * Math.cos(st.pitch) * st.dist); cam.lookAt(0, 4, cz);
  ren.render(scene, cam);
  items.forEach(it => { const v = it.pos.clone(); v.y = -1.5; v.project(cam); it.lab.style.left = ((v.x + 1) / 2 * w) + 'px'; it.lab.style.top = ((1 - v.y) / 2 * h) + 'px'; it.lab.style.display = v.z < 1 ? '' : 'none'; });
  requestAnimationFrame(frame); }
frame();
</script>
</body>
</html>
